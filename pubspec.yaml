name: lakbay_app
description: "Plan your journey together."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  image_picker: ^1.2.1
  permission_handler: ^12.0.1 
  pdf: ^3.10.0
  printing: ^5.11.0
  intl: ^0.19.0
  image: ^4.1.0
  http: ^1.1.0

  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  path_provider: ^2.1.0 
   

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1  
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/Lakbay_Logo.png"
  min_sdk_android: 21

flutter_native_splash:
  # 1. Background Color (Fills the screen so the image doesn't stretch)
  color: "#5a2708" 

  # 2. The Logo (Centered automatically, maintains aspect ratio)
  image: "assets/images/app_icon.png"

  # 3. Android 12+ Specific Settings (Required for newer phones)
  android_12:
    image: "assets/images/app_icon.png"
    icon_background_color: "#5a2708"
